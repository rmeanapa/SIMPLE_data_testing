name: Run SIMPLE Test Suite

on:
  push: {}
  schedule:
    - cron: '0 4 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_self_hosted:
    name: SIMPLE tests on self-hosted runner
    runs-on: [self-hosted, linux]
    timeout-minutes: 1440

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: bash
        run: |
          export SIMPLE_EMAIL="my.name@uni.edu"
          export SIMPLE_QSYS="local"
          export SIMPLE_PATH=/home/meanapanedar2/SIMPLE/build
          export PATH=${SIMPLE_PATH}/scripts:${SIMPLE_PATH}/bin:${PATH}
          which simple_exec
          which simple_test_exec
          echo $SIMPLE_PATH
          bash "${GITHUB_WORKSPACE}/run_simple_tests.sh" --timeout 0

