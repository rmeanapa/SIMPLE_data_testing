name: Debug Runner Timezone

on:
  workflow_dispatch: # Allows you to trigger this manually with a button click

jobs:
  print-time:
    runs-on: ubuntu-latest
    steps:
      - name: Check Current Server Times
        run: |
          echo "=== TIME DEBUG INFO ==="
          echo "Current UTC Time:            $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Current New York Time:       $(TZ='America/New_York' date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Current New York Hour Only:  $(TZ='America/New_York' date +'%H')"
          echo "======================="
