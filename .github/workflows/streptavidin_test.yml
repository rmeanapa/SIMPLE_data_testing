name: Streptavidin 100-restart CI

on:
  #push: {}
  schedule:
    - cron: '30 0 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  streptavidin:
    runs-on: [self-hosted, FRCE_HPC_streptavidin]
    timeout-minutes: 1440
    env:
      SIMPLE_PATH: /home/meanapanedar2/SIMPLE/build
      RUN_DIR: ${{ github.workspace }}/ci_runs/${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run 100 streptavidin reconstructions
        run: |
          mkdir -p "$RUN_DIR"
          cd "$RUN_DIR"
          bash "$GITHUB_WORKSPACE/submit_data_testing.sh" streptavidin
      - name: Generate streptavidin report
        if: always()
        run: REPORT_SITE_DIR="$RUN_DIR/streptavidin/site" bash ./make_report.sh "$RUN_DIR/streptavidin"
      - name: Upload final volumes, logs and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streptavidin-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci_runs/**/streptavidin/site/
            ci_runs/**/streptavidin/restart_*/*_solve3D/rec_final_state01.mrc
            ci_runs/**/streptavidin/restart_*/SOLVE3D_OUTPUT_RESTART*
            ci_runs/**/streptavidin/restart_*/LOG
            ci_runs/**/logs/streptavidin-*.out
            ci_runs/**/logs/streptavidin-*.err
            ci_runs/**/jobs.txt
      - name: Package streptavidin webpage assets
        if: always()
        run: bash .github/scripts/package_report_site.sh "$RUN_DIR/streptavidin/site" "$RUN_DIR/streptavidin/webpage"
      - name: Upload independent streptavidin webpage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streptavidin-report-site
          path: ci_runs/${{ github.run_id }}_${{ github.run_attempt }}/streptavidin/webpage/
          if-no-files-found: error
          retention-days: 31

  publish_report:
    name: Publish streptavidin webpage
    needs: streptavidin
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: simple-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the latest main report and all peer reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/restore_report_sites.sh site streptavidin
          rm -rf site/streptavidin
      - uses: actions/download-artifact@v4
        with:
          name: streptavidin-report-site
          path: site/streptavidin
      - name: Package and check the complete Pages site
        run: bash .github/scripts/package_report_site.sh site pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy streptavidin webpage
        id: deployment
        uses: actions/deploy-pages@v4
