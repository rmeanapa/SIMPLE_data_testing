name: Run & Display SIMPLE Data Sets

on:
  # push: {}
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  SIMPLE_SYSTEMS: betagal apof clc motab proteasome trpm4 nanox

jobs:
  build_self_hosted:
    name: Build on self-hosted runner
    runs-on: [self-hosted, FRCE_HPC]
    timeout-minutes: 1440

    steps:
      - uses: actions/checkout@v4

      - name: Update and compile SIMPLE
        working-directory: /home/meanapanedar2/SIMPLE
        run: |
          git pull --ff-only
          ./compile_clean.sh

      - name: Run tests
        run: |
          export SIMPLE_EMAIL="my.name@uni.edu"
          export SIMPLE_QSYS="local"
          export SIMPLE_PATH=/home/meanapanedar2/SIMPLE/build
          export PATH=${SIMPLE_PATH}/scripts:${SIMPLE_PATH}/bin:${PATH}
          which simple_exec
          echo $SIMPLE_PATH
          ./submit_data_testing.sh

      - name: Prepare report for Pages
        run: |
          ./make_report.sh $SIMPLE_SYSTEMS test_simulated_workflow_1jxy test_simulated_workflow_6vxx test_single_workflow_fcc test_single_workflow_wurtzite

      - name: Package main webpage assets
        run: bash .github/scripts/package_report_site.sh build report-site

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-data-sets-report-${{ github.run_number }}
          path: report-site/
          if-no-files-found: error
          retention-days: 31

  deploy_pages:
    name: Deploy report to GitHub Pages
    needs: build_self_hosted
    runs-on: ubuntu-latest
    concurrency:
      group: simple-report-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simple-data-sets-report-${{ github.run_number }}
          path: site
      - name: Restore all independent reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/restore_report_sites.sh site main
      - name: Package and check the complete Pages site
        run: bash .github/scripts/package_report_site.sh site pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
