name: Run & Display SIMPLE Data Sets

on:
  push: {}
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SIMPLE_SYSTEMS: betagal apof clc motab proteasome trpm4 nanox

jobs:
  build_self_hosted:
    name: Build on self-hosted runner
    runs-on: [self-hosted, FRCE_HPC]
    timeout-minutes: 1440

    steps:
      - uses: actions/checkout@v4

      - name: Update and compile SIMPLE
        working-directory: /home/meanapanedar2/SIMPLE
        run: |
          git pull --ff-only
          ./compile_clean.sh

      - name: Run tests
        run: |
          export SIMPLE_EMAIL="my.name@uni.edu"
          export SIMPLE_QSYS="local"
          export SIMPLE_PATH=/home/meanapanedar2/SIMPLE/build
          export PATH=${SIMPLE_PATH}/scripts:${SIMPLE_PATH}/bin:${PATH}
          which simple_exec
          echo $SIMPLE_PATH
          ./submit_data_testing.sh
          echo "6VXX"
          simple_test_exec test=simulated_workflow suite=6vxx > LOG_6vxx
          echo "1JXY"
          simple_test_exec test=simulated_workflow suite=1jxy > LOG_1jxy
          echo "SINGLE FCC Pt"
          simple_test_exec test=single_workflow suite=fcc > LOG_single_fcc
          echo "SINGLE wurtzite CdSe"
          simple_test_exec test=single_workflow suite=wurtzite > LOG_single_wurtzite

      - name: Prepare report for Pages
        run: |
          ./make_report.sh $SIMPLE_SYSTEMS test_simulated_workflow_1jxy test_simulated_workflow_6vxx test_single_workflow_fcc test_single_workflow_wurtzite

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-data-sets-report-${{ github.run_number }}
          path: build/
          if-no-files-found: error
          retention-days: 31

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy_pages:
    name: Deploy report to GitHub Pages
    needs: build_self_hosted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
