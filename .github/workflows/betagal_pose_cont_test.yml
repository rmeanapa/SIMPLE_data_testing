name: Betagal pose continuation CI

on:
  #push: {}
  schedule:
    - cron: '30 0 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  betagal_pose_cont:
    runs-on: [self-hosted, FRCE_HPC_pose_cont]
    timeout-minutes: 1440
    env:
      SIMPLE_PATH: /home/meanapanedar2/SIMPLE/build
      RUN_DIR: ${{ github.workspace }}/ci_runs/${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions history tooling
        run: bash .github/scripts/test_pose_cont_history.sh
      - name: Run betagal pose-continuation comparison
        run: |
          mkdir -p "$RUN_DIR"
          cd "$RUN_DIR"
          bash "$GITHUB_WORKSPACE/submit_data_testing.sh" betagal_pose_cont
      - name: Generate betagal_pose_cont report
        if: always()
        run: REPORT_SITE_DIR="$RUN_DIR/betagal_pose_cont/site" bash ./make_report.sh "$RUN_DIR/betagal_pose_cont"
      - name: Add successful Actions history to the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/pose_cont_history.sh "$RUN_DIR/betagal_pose_cont/site"
      - name: Upload logs and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betagal_pose_cont-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ci_runs/**/betagal_pose_cont/site/
            ci_runs/**/betagal_pose_cont/**/LOG
            ci_runs/**/logs/betagal_pose_cont-*.out
            ci_runs/**/logs/betagal_pose_cont-*.err
            ci_runs/**/jobs.txt
      - name: Package betagal_pose_cont webpage assets
        if: always()
        run: bash .github/scripts/package_report_site.sh "$RUN_DIR/betagal_pose_cont/site" "$RUN_DIR/betagal_pose_cont/webpage"
      - name: Upload independent betagal_pose_cont webpage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betagal_pose_cont-report-site
          path: ci_runs/${{ github.run_id }}_${{ github.run_attempt }}/betagal_pose_cont/webpage/
          if-no-files-found: error
          retention-days: 31

  publish_report:
    name: Publish betagal_pose_cont webpage
    needs: betagal_pose_cont
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: simple-report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the latest main report and all peer reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/restore_report_sites.sh site betagal_pose_cont
          rm -rf site/betagal_pose_cont
      - uses: actions/download-artifact@v4
        with:
          name: betagal_pose_cont-report-site
          path: site/betagal_pose_cont
      - name: Package and check the complete Pages site
        run: bash .github/scripts/package_report_site.sh site pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy betagal_pose_cont webpage
        id: deployment
        uses: actions/deploy-pages@v4
